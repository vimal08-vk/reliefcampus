# ReliefCamp - Disaster Relief Camp Resource Tracker
server.port=8080
spring.application.name=ReliefCamp

# ================================================================
# MySQL Database Configuration (XAMPP)
# Host: localhost | Port: 3306 | Database: reliefcamp
# Username: root | Password: (empty by default for XAMPP)
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/reliefcamp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Automatically creates and updates tables in MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not run raw script on boot since Hibernate handles schema automatically
spring.sql.init.mode=never

# Date Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
